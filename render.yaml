services:
  - type: web
    name: aml-dashboard
    runtime: python
    rootDir: aml_dashboard_integration_package
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AML_DB_HOST
        sync: false
      - key: AML_DB_PORT
        value: 5432
      - key: AML_DB_NAME
        value: postgres
      - key: AML_DB_USER
        sync: false
      - key: AML_DB_PASSWORD
        sync: false
      - key: AML_DB_SSLMODE
        value: require
      - key: AML_APP_USERNAME
        sync: false
      - key: AML_APP_PASSWORD
        sync: false
